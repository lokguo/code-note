<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>CodeNote</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <span class="titlebar-label">~/codenote</span>
    </div>
    <div class="titlebar-right">
      <button id="pinBtn" class="tbtn" title="釘選在最上層">📌</button>
      <button id="themeBtn" class="tbtn" title="切換深色/淺色模式">◐</button>
      <button id="minBtn" class="tbtn" title="最小化至系統匣">—</button>
      <button id="closeBtn" class="tbtn tbtn-close" title="關閉">×</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="todo">todo.md</button>
    <button class="tab" data-tab="notes">notes.md</button>
  </div>

  <div class="panel" id="panel-todo">
    <div class="todo-input-row">
      <span class="prompt">&gt;</span>
      <input id="todoInput" type="text" placeholder="輸入待辦事項，按 Enter 新增…" autocomplete="off" />
    </div>
    <ul id="todoList" class="todo-list"></ul>
  </div>

  <div class="panel hidden" id="panel-notes">
    <div class="notes-wrap">
      <textarea id="notesArea" placeholder="// 在這裡自由記事…" spellcheck="false"></textarea>
    </div>
  </div>

  <div class="statusbar">
    <span id="countLabel">0 items</span>
    <span class="sep">|</span>
    <label class="autostart-label">
      <input type="checkbox" id="autostartCheck" />
      開機自動啟動
    </label>
    <span class="sep">|</span>
    <span id="saveStatus">saved</span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
